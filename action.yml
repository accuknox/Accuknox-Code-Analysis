name: "AccuKnox ASPM Scan"
description: "Unified AccuKnox ASPM scanner. Run any combination via scan_type: sast, sca, secret, iac, ml, sbom."

branding:
  icon: "shield"
  color: "purple"

inputs:
  # ------------------------------------------------------------------
  # Which scans to run
  # ------------------------------------------------------------------
  scan_type:
    description: "Comma/space separated list of scans to run, in order: sast, sca, secret, iac, ml, sbom"
    required: true

  # ------------------------------------------------------------------
  # Common AccuKnox configuration
  # ------------------------------------------------------------------
  accuknox_endpoint:
    description: "AccuKnox CSPM panel endpoint URL"
    required: true
  accuknox_token:
    description: "Token for authenticating with the AccuKnox CSPM panel"
    required: true
  accuknox_label:
    description: "Label in AccuKnox SaaS for associating scan results"
    required: true
  scanner_version:
    description: "Version (git tag) of the accuknox-aspm-scanner binary to download (v0.17.0 or later: the action runs its pipeline command)"
    required: false
    default: "v0.17.0"
  soft_fail:
    description: "Do not fail the build on findings or a failed quality-gate policy. Scans that cannot run or upload, and a gate that cannot be evaluated, still fail."
    required: false
    default: "true"
  upload_artifact:
    description: "Upload kept scan result files as a GitHub artifact"
    required: false
    default: "false"
  quality_gate:
    description: "Let the AccuKnox quality-gate policy pass, warn or fail the build for sast, sca, secret, iac and sbom (ml is not gated). Requires gate_token and an AccuKnox environment with quality gates."
    required: false
    default: "false"
  gate_token:
    description: "AccuKnox user token for the quality-gate API (required when quality_gate is true; the label token in accuknox_token is not accepted there)"
    required: false
    default: ""
  gate_timeout:
    description: "Seconds to wait for the quality-gate verdict"
    required: false
    default: "300"
  container_mode:
    description: "Run sast/sca/secret/iac/sbom in Docker (--container-mode) instead of the locally-installed/cached CLI tool binaries. ml always scans in its container, and only when model files are found."
    required: false
    default: "false"

  # ------------------------------------------------------------------
  # SAST (OpenGrep)
  # ------------------------------------------------------------------
  sast_command:
    description: "sast: command text passed to --command (the directory/target to scan)"
    required: false
    default: "."
  sast_severity:
    description: "Deprecated and ignored: quality-gate policies decide which findings fail the build"
    required: false
    default: "HIGH"

  # ------------------------------------------------------------------
  # SCA (Trivy filesystem)
  # ------------------------------------------------------------------
  sca_command:
    description: "sca: command text passed to --command (e.g. 'fs .')"
    required: false
    default: "fs ."
  sca_severity:
    description: "Deprecated and ignored: quality-gate policies decide which findings fail the build"
    required: false
    default: ""

  # ------------------------------------------------------------------
  # Secret (TruffleHog)
  # ------------------------------------------------------------------
  secret_command:
    description: "secret: command text passed to --command (e.g. 'git file://.' or 'filesystem .')"
    required: false
    default: "git file://."
  secret_additional_arguments:
    description: "secret: extra arguments appended to the secret command (e.g. --results verified --branch main)"
    required: false
    default: ""

  # ------------------------------------------------------------------
  # IaC (Checkov) - with framework support
  # ------------------------------------------------------------------
  iac_command:
    description: "iac: raw command text passed to --command. When set, overrides iac_directory/iac_file/iac_framework/iac_compact/iac_quiet."
    required: false
    default: ""
  iac_directory:
    description: "iac: directory with infrastructure code to scan"
    required: false
    default: "."
  iac_file:
    description: "iac: specific file to scan; cannot be used with iac_directory"
    required: false
    default: ""
  iac_framework:
    description: "iac: restrict scan to specific framework(s), e.g. Kubernetes, Terraform, terraform_plan (comma-separated for multiple)"
    required: false
    default: ""
  iac_compact:
    description: "iac: do not display code blocks in output"
    required: false
    default: "true"
  iac_quiet:
    description: "iac: display only failed checks"
    required: false
    default: "true"

  # ------------------------------------------------------------------
  # ML Static Scan (ModelScan)
  # ------------------------------------------------------------------
  ml_command:
    description: "ml: command text passed to --command (e.g. 'scan -p . -r json')"
    required: false
    default: "scan -p . -r json"
  ml_model_name:
    description: "Deprecated and ignored: the model identifier is derived from the repository"
    required: false
    default: ""
  ml_source_type:
    description: "Deprecated and ignored: always github"
    required: false
    default: "github"

  # ------------------------------------------------------------------
  # SBOM (image and filesystem)
  # ------------------------------------------------------------------
  sbom_scan_type:
    description: "sbom: target type, 'image' or 'filesystem'"
    required: false
    default: "filesystem"
  sbom_image_ref:
    description: "sbom: full registry image reference to scan (required when sbom_scan_type is image)"
    required: false
    default: ""
  sbom_scan_path:
    description: "sbom: filesystem path to scan (used when sbom_scan_type is filesystem)"
    required: false
    default: "."
  sbom_command:
    description: "sbom: raw command text passed to --command. When set, overrides sbom_scan_type/sbom_image_ref/sbom_scan_path."
    required: false
    default: ""
  sbom_severity:
    description: "sbom: comma-separated severities (UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL)"
    required: false
    default: ""
  sbom_project_name:
    description: "sbom: project name (AccuKnox entity). Required for sbom"
    required: false
    default: ""

  # ------------------------------------------------------------------
  # PR Decorator: a preview feature of the scanner, not available in this
  # version of the action. The inputs are kept so workflows that set them
  # keep working; they are ignored with a warning.
  # ------------------------------------------------------------------
  pr_decorator:
    description: "Preview, not available in this version: ignored with a warning. (Will post findings as a GitHub PR review.)"
    required: false
    default: "false"
  pr_decorator_mode:
    description: "Preview, not available in this version: ignored."
    required: false
    default: "advisory"
  llm_api_key:
    description: "Preview (pr_decorator), not available in this version: ignored."
    required: false
    default: ""
  llm_model:
    description: "Preview (pr_decorator), not available in this version: ignored."
    required: false
    default: ""
  llm_base_url:
    description: "Preview (pr_decorator), not available in this version: ignored."
    required: false
    default: ""

outputs:
  gate_status:
    description: "Quality-gate verdict: passed, warning, failed, error, timeout, unsupported, rejected, or skipped when the gate had nothing to evaluate. Empty when quality_gate is false."
    value: ${{ steps.scan.outputs.gate_status }}

runs:
  using: "composite"
  steps:
    # ------------------------------------------------------------------
    # Parse scan_type + install the scanner (once)
    # ------------------------------------------------------------------
    - name: Setup AccuKnox Scanner
      id: setup
      shell: bash
      env:
        SCAN_TYPE: ${{ inputs.scan_type }}
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        SCANNER_VERSION: ${{ inputs.scanner_version }}
        CONTAINER_MODE: ${{ inputs.container_mode }}
        QUALITY_GATE: ${{ inputs.quality_gate }}
        GATE_TOKEN: ${{ inputs.gate_token }}
        SAST_SEVERITY: ${{ inputs.sast_severity }}
        SCA_SEVERITY: ${{ inputs.sca_severity }}
        ML_MODEL_NAME: ${{ inputs.ml_model_name }}
        ML_SOURCE_TYPE: ${{ inputs.ml_source_type }}
      run: |
        set -e
        if [ -z "$ACCUKNOX_ENDPOINT" ] || [ -z "$ACCUKNOX_TOKEN" ] || [ -z "$ACCUKNOX_LABEL" ]; then
          echo "::error::accuknox_endpoint, accuknox_token and accuknox_label must be set. Pull requests from forks and Dependabot do not receive repository secrets."
          exit 1
        fi
        QUALITY_GATE="$(echo "$QUALITY_GATE" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
        if [ "$QUALITY_GATE" = "true" ] && [ -z "$GATE_TOKEN" ]; then
          echo "::error::gate_token must be set to an AccuKnox user token when quality_gate is true. Set quality_gate: false to scan without the quality gate."
          exit 1
        fi

        # scan_type -> the pipeline's --scans, in the order given (comma/space separated, aliases accepted).
        SCANS=""
        add_scan() { case ",$SCANS," in *",$1,"*) ;; *) SCANS="${SCANS:+$SCANS,}$1" ;; esac; }
        for t in $(echo "$SCAN_TYPE" | tr '[:upper:]' '[:lower:]' | tr ',' ' '); do
          case "$t" in
            sast)                add_scan sast ;;
            sca)                 add_scan sca ;;
            secret|secrets)      add_scan secret ;;
            iac)                 add_scan iac ;;
            ml|ml-scan|mlscan)   add_scan ml ;;
            sbom)                add_scan sbom ;;
            api|api-discovery)   echo "::warning::api-discovery has been removed from this action: AccuKnox cannot import its results yet. The other scans still run." ;;
            *)                   echo "::warning::Unknown scan type '$t' (valid: sast, sca, secret, iac, ml, sbom)." ;;
          esac
        done
        [ -n "$SCANS" ] || { echo "::error::scan_type did not match any scan. Provide one or more of: sast, sca, secret, iac, ml, sbom."; exit 1; }
        echo "scans=$SCANS" >> "$GITHUB_OUTPUT"
        if [ "$QUALITY_GATE" = "true" ] && [ "$SCANS" = "ml" ]; then
          echo "::notice::quality_gate is on, but only ml was selected, which the quality gate does not cover."
        fi

        # Inputs the pipeline no longer uses.
        [ -z "${SCA_SEVERITY//[$'\t\r\n ']}" ] && [ "${SAST_SEVERITY//[$'\t\r\n ']}" = "HIGH" ] || \
          echo "::warning::sast_severity and sca_severity are ignored: the quality-gate policy in AccuKnox decides which findings fail the build (with quality_gate: false, findings fail it unless soft_fail)."
        [ -z "$ML_MODEL_NAME" ] && [ "$ML_SOURCE_TYPE" = "github" ] || \
          echo "::warning::ml_model_name and ml_source_type are ignored: the model identifier is derived from the repository."

        echo "Downloading AccuKnox ASPM Scanner ($SCANNER_VERSION)..."
        SCANNER_BIN="$RUNNER_TEMP/accuknox-aspm-scanner"
        curl -fsSL --retry 3 --retry-delay 5 \
          "https://github.com/accuknox/aspm-scanner-cli/releases/download/${SCANNER_VERSION}/accuknox-aspm-scanner" -o "$SCANNER_BIN"
        chmod +x "$SCANNER_BIN"
        echo "ACCUKNOX_SCANNER=$SCANNER_BIN" >> "$GITHUB_ENV"

        # Local tools the selected scans need. container_mode runs them in Docker instead, and ml
        # pulls its own image only when model files are found, so neither installs anything here.
        CONTAINER_MODE="${CONTAINER_MODE//[$'\t\r\n ']}"
        echo "container_mode=$CONTAINER_MODE" >> "$GITHUB_OUTPUT"
        tools=""; images=""
        for scan in ${SCANS//,/ }; do
          case "$scan" in
            sast) t=sast ;; sca|sbom) t=container ;; secret) t=secret ;; iac) t=iac ;; *) t="" ;;
          esac
          [ -n "$t" ] || continue
          case " $tools " in *" $t "*) continue ;; esac
          tools+=" $t"
        done
        tools="${tools# }"
        if [ "$CONTAINER_MODE" = "true" ]; then images="$tools"; tools=""; fi
        echo "tools=$tools" >> "$GITHUB_OUTPUT"
        for t in sast container secret iac; do
          case " $images " in *" $t "*) echo "img_$t=true" ;; *) echo "img_$t=false" ;; esac
        done >> "$GITHUB_OUTPUT"
        sha=$(sha256sum "$SCANNER_BIN" | cut -c1-12)
        echo "scanner_sha=$sha" >> "$GITHUB_OUTPUT"
        echo "tools_key=$sha-${tools// /-}" >> "$GITHUB_OUTPUT"

    - name: Cache scanner tools
      id: tools-cache
      if: steps.setup.outputs.tools != ''
      uses: actions/cache@v4
      with:
        path: ~/.local/bin/accuknox
        key: accuknox-tools-${{ runner.os }}-${{ steps.setup.outputs.tools_key }}
        restore-keys: accuknox-tools-${{ runner.os }}-${{ steps.setup.outputs.scanner_sha }}

    - name: Install scanner tools
      if: steps.setup.outputs.tools != '' && steps.tools-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -e
        # `tool install` exits 0 even when the download silently fails, so verify the expected
        # binary actually landed and retry instead of trusting the exit code.
        if [ -d /usr/share/accuknox-aspm-scanner/tools ]; then
          TOOLS_DIR=/usr/share/accuknox-aspm-scanner/tools
        else
          TOOLS_DIR="$HOME/.local/bin/accuknox"
        fi
        install_tool() {
          verify_path="$TOOLS_DIR/$2"
          [ -e "$verify_path" ] && return 0
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "Installing scanner tool '$1' (attempt $attempt/3)..."
            "$ACCUKNOX_SCANNER" tool install --type "$1" || true
            [ -e "$verify_path" ] && return 0
            echo "WARNING: '$1' not present at $verify_path after install; retrying..."
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "ERROR: failed to install scanner tool '$1' (expected $verify_path)."
          return 1
        }
        for t in ${{ steps.setup.outputs.tools }}; do
          verify_rel="$t"; [ "$t" = sast ] && verify_rel="sast/sast"
          install_tool "$t" "$verify_rel"
        done

    # container_mode only: cache each scanner image as a docker-save tarball instead of re-pulling it.
    - name: Restore cached SAST image
      id: sast-image-cache
      if: steps.setup.outputs.img_sast == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/accuknox-images/sast.tar
        key: accuknox-image-sast-0.1.0-linux-amd64

    - name: Restore cached container (SCA/SBOM) image
      id: container-image-cache
      if: steps.setup.outputs.img_container == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/accuknox-images/container.tar
        key: accuknox-image-container-0.69.3-linux-amd64

    - name: Restore cached Secret image
      id: secret-image-cache
      if: steps.setup.outputs.img_secret == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/accuknox-images/secret.tar
        key: accuknox-image-secret-3.90.3-linux-amd64

    - name: Restore cached IaC image
      id: iac-image-cache
      if: steps.setup.outputs.img_iac == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/accuknox-images/iac.tar
        key: accuknox-image-iac-3.2.458-linux-amd64

    - name: Load or pull container-mode images
      if: steps.setup.outputs.container_mode == 'true'
      shell: bash
      run: |
        set -e
        load_or_pull() {
          [ "$1" = true ] || return 0
          [ "$2" = true ] && { docker load -i "$4"; return; }
          docker pull "$3" && mkdir -p "$(dirname "$4")" && docker save -o "$4" "$3"
        }
        load_or_pull "${{ steps.setup.outputs.img_sast }}" "${{ steps.sast-image-cache.outputs.cache-hit }}" public.ecr.aws/k9v9d5v2/accuknox/opengrepjob:0.1.0 "${{ runner.temp }}/accuknox-images/sast.tar"
        load_or_pull "${{ steps.setup.outputs.img_container }}" "${{ steps.container-image-cache.outputs.cache-hit }}" public.ecr.aws/k9v9d5v2/accuknox/trivy:0.69.3 "${{ runner.temp }}/accuknox-images/container.tar"
        load_or_pull "${{ steps.setup.outputs.img_secret }}" "${{ steps.secret-image-cache.outputs.cache-hit }}" public.ecr.aws/k9v9d5v2/trufflesecurity/trufflehog:3.90.3 "${{ runner.temp }}/accuknox-images/secret.tar"
        load_or_pull "${{ steps.setup.outputs.img_iac }}" "${{ steps.iac-image-cache.outputs.cache-hit }}" public.ecr.aws/k9v9d5v2/bridgecrew/checkov:3.2.458 "${{ runner.temp }}/accuknox-images/iac.tar"

    # ------------------------------------------------------------------
    # Every scan, the uploads and the quality gate: one pipeline run. The
    # step records its exit code instead of failing, so the artifact upload
    # below still runs; the last step fails the job.
    # ------------------------------------------------------------------
    - name: Run AccuKnox scans
      id: scan
      shell: bash
      env:
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        ACCUKNOX_GATE_TOKEN: ${{ inputs.gate_token }}
        SCANS: ${{ steps.setup.outputs.scans }}
        QUALITY_GATE: ${{ inputs.quality_gate }}
        GATE_TIMEOUT: ${{ inputs.gate_timeout }}
        SOFT_FAIL: ${{ inputs.soft_fail }}
        CONTAINER_MODE: ${{ steps.setup.outputs.container_mode }}
        KEEP_RESULTS: ${{ inputs.upload_artifact == 'true' }}
        SAST_COMMAND: ${{ inputs.sast_command }}
        SCA_COMMAND: ${{ inputs.sca_command }}
        SECRET_COMMAND: ${{ inputs.secret_command }}
        SECRET_ADDITIONAL_ARGUMENTS: ${{ inputs.secret_additional_arguments }}
        IAC_RAW_COMMAND: ${{ inputs.iac_command }}
        IAC_DIRECTORY: ${{ inputs.iac_directory }}
        IAC_FILE: ${{ inputs.iac_file }}
        IAC_FRAMEWORK: ${{ inputs.iac_framework }}
        IAC_COMPACT: ${{ inputs.iac_compact }}
        IAC_QUIET: ${{ inputs.iac_quiet }}
        ML_COMMAND: ${{ inputs.ml_command }}
        SBOM_SCAN_TYPE: ${{ inputs.sbom_scan_type }}
        SBOM_IMAGE_REF: ${{ inputs.sbom_image_ref }}
        SBOM_SCAN_PATH: ${{ inputs.sbom_scan_path }}
        SBOM_RAW_COMMAND: ${{ inputs.sbom_command }}
        SBOM_SEVERITY: ${{ inputs.sbom_severity }}
        SBOM_PROJECT_NAME: ${{ inputs.sbom_project_name }}
      run: |
        set -e
        trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; echo "${v%"${v##*[![:space:]]}"}"; }
        ARGS=(pipeline --scans "$SCANS")

        case ",$SCANS," in *,sast,*) ARGS+=(--sast-command "$SAST_COMMAND") ;; esac
        case ",$SCANS," in *,sca,*) ARGS+=(--sca-command "$SCA_COMMAND") ;; esac
        case ",$SCANS," in *,ml,*) ARGS+=(--ml-command "$ML_COMMAND") ;; esac
        case ",$SCANS," in *,secret,*)
          SECRET="$SECRET_COMMAND"
          [ -n "$SECRET_ADDITIONAL_ARGUMENTS" ] && SECRET="$SECRET $SECRET_ADDITIONAL_ARGUMENTS"
          ARGS+=(--secret-command "$SECRET") ;;
        esac
        case ",$SCANS," in *,iac,*)
          if [ -n "$IAC_RAW_COMMAND" ]; then
            IAC="$IAC_RAW_COMMAND"
          else
            IAC=""
            # --file and --directory are mutually exclusive in Checkov; file wins.
            if [ -n "$IAC_FILE" ]; then IAC="--file $IAC_FILE"; elif [ -n "$IAC_DIRECTORY" ]; then IAC="--directory $IAC_DIRECTORY"; fi
            [ "$IAC_COMPACT" = "true" ] && IAC="$IAC --compact"
            [ "$IAC_QUIET" = "true" ] && IAC="$IAC --quiet"
            for fw in ${IAC_FRAMEWORK//,/ }; do IAC="$IAC --framework $fw"; done
          fi
          ARGS+=(--iac-command "$(trim "$IAC")") ;;
        esac
        case ",$SCANS," in *,sbom,*)
          PROJECT_NAME="$(trim "$SBOM_PROJECT_NAME")"
          [ -n "$PROJECT_NAME" ] || { echo "::error::sbom_project_name is required for sbom."; exit 1; }
          if [ -n "$SBOM_RAW_COMMAND" ]; then
            SBOM="$SBOM_RAW_COMMAND"
          else
            case "$(trim "$SBOM_SCAN_TYPE")" in
              image)
                [ -n "$SBOM_IMAGE_REF" ] || { echo "::error::sbom_image_ref is required when sbom_scan_type is image."; exit 1; }
                SBOM="image $SBOM_IMAGE_REF" ;;
              filesystem|path|fs) SBOM="filesystem $SBOM_SCAN_PATH" ;;
              *) echo "::error::Invalid sbom_scan_type: $SBOM_SCAN_TYPE. Expected image or filesystem."; exit 1 ;;
            esac
            SEVERITY="${SBOM_SEVERITY//[$'\t\r\n ']}"
            [ -n "$SEVERITY" ] && SBOM="$SBOM --severity $SEVERITY"
          fi
          ARGS+=(--sbom-command "$SBOM" --project-name "$PROJECT_NAME") ;;
        esac

        [ "$CONTAINER_MODE" = "true" ] && ARGS+=(--container-mode)
        [ "$(trim "$SOFT_FAIL")" = "true" ] && ARGS+=(--softfail)
        GATE=false
        if [ "$(echo "$QUALITY_GATE" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')" = "true" ]; then
          GATE=true
          GATE_JSON="$RUNNER_TEMP/accuknox-quality-gate.json"
          rm -f "$GATE_JSON"
          ARGS+=(--quality-gate --gate-timeout "$(trim "$GATE_TIMEOUT")" --gate-json-file "$GATE_JSON")
        fi

        # Result files land in the pipeline's work directory under TMPDIR; keep them for the
        # artifact.
        WORK="$RUNNER_TEMP/accuknox-work"
        RESULTS="$RUNNER_TEMP/accuknox-results"
        rm -rf "$WORK" "$RESULTS"; mkdir -p "$WORK" "$RESULTS"
        [ "$KEEP_RESULTS" = "true" ] && ARGS+=(--keep-results)

        set +e
        TMPDIR="$WORK" "$ACCUKNOX_SCANNER" "${ARGS[@]}"
        EXIT=$?
        set -e
        echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"

        if [ "$KEEP_RESULTS" = "true" ]; then
          for dir in "$WORK"/accuknox-pipeline-*; do
            [ -d "$dir" ] && find "$dir" -maxdepth 1 -type f -exec mv {} "$RESULTS"/ \;
          done
          echo "results_dir=$RESULTS" >> "$GITHUB_OUTPUT"
        fi

        if [ "$GATE" = true ]; then
          if [ -f "$GATE_JSON" ]; then
            python3 - "$GATE_JSON" <<'PY' || echo "gate_status=error" >> "$GITHUB_OUTPUT"
        import json, os, sys
        doc = json.load(open(sys.argv[1], encoding="utf-8"))
        resp = doc.get("response") or {}
        status = (resp.get("status") if doc.get("state") == "resolved" else None) or doc.get("state") or "error"
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write("gate_status=" + status + "\n")
        PY
          else
            # No verdict was requested: nothing gated was uploaded (or a scan/upload failed first,
            # which the exit code reports).
            echo "gate_status=skipped" >> "$GITHUB_OUTPUT"
          fi
        fi

    # ------------------------------------------------------------------
    # Upload kept result files (optional)
    # ------------------------------------------------------------------
    - name: Upload AccuKnox scan results
      if: ${{ inputs.upload_artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: accuknox-scan-results
        path: ${{ runner.temp }}/accuknox-results/
        if-no-files-found: warn
        retention-days: 30

    - name: PR decorator (preview)
      if: ${{ inputs.pr_decorator == 'true' }}
      shell: bash
      run: echo "::warning title=AccuKnox PR decorator::pr_decorator is a preview feature and is not available in this version of the action, so no PR review is posted. The input is ignored."

    # ------------------------------------------------------------------
    # The build verdict: the pipeline's exit code (policy failure 1, a scan
    # that could not run/upload or a gate that could not be evaluated 2).
    # ------------------------------------------------------------------
    - name: AccuKnox result
      shell: bash
      run: exit ${{ steps.scan.outputs.exit_code || 1 }}
