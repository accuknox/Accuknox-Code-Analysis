name: "AccuKnox ASPM Scan"
description: "Unified AccuKnox ASPM scanner. Run any combination via scan_type: sast, sca, secret, iac, ml, api-discovery, sbom."

branding:
  icon: "shield"
  color: "purple"

inputs:
  # ------------------------------------------------------------------
  # Which scans to run
  # ------------------------------------------------------------------
  scan_type:
    description: "Comma/space separated list of scans to run: sast, sca, secret, iac, ml, api-discovery, sbom"
    required: true

  # ------------------------------------------------------------------
  # Common AccuKnox configuration
  # ------------------------------------------------------------------
  accuknox_endpoint:
    description: "AccuKnox CSPM panel endpoint URL"
    required: true
  accuknox_token:
    description: "Token for authenticating with the AccuKnox CSPM panel"
    required: true
  accuknox_label:
    description: "Label in AccuKnox SaaS for associating scan results"
    required: true
  scanner_version:
    description: "Version (git tag) of the accuknox-aspm-scanner binary to download (must include the sca, ml, and api-discovery scanners)"
    required: false
    default: "v0.14.7-rc.3"
  soft_fail:
    description: "Do not return a non-zero exit code if a scan finds issues (applies to all scans)"
    required: false
    default: "true"
  upload_artifact:
    description: "Upload kept scan result files as a GitHub artifact"
    required: false
    default: "false"
  container_mode:
    description: "Run sast/sca/secret/iac/sbom in Docker (--container-mode) instead of the locally-installed/cached CLI tool binaries. ml-scan and api-discovery always run in container mode regardless of this flag (no local tool-install path exists for them)."
    required: false
    default: "false"

  # ------------------------------------------------------------------
  # SAST (OpenGrep)
  # ------------------------------------------------------------------
  sast_command:
    description: "sast: command text passed to --command (the directory/target to scan)"
    required: false
    default: "."
  sast_severity:
    description: "sast: comma-separated severities (LOW, MEDIUM, HIGH, CRITICAL)"
    required: false
    default: "HIGH"

  # ------------------------------------------------------------------
  # SCA (Trivy filesystem)
  # ------------------------------------------------------------------
  sca_command:
    description: "sca: command text passed to --command (e.g. 'fs .')"
    required: false
    default: "fs ."
  sca_severity:
    description: "sca: comma-separated severities to fail on (UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL)"
    required: false
    default: ""

  # ------------------------------------------------------------------
  # Secret (TruffleHog)
  # ------------------------------------------------------------------
  secret_command:
    description: "secret: command text passed to --command (e.g. 'git file://.' or 'filesystem .')"
    required: false
    default: "git file://."
  secret_additional_arguments:
    description: "secret: extra arguments appended to the secret command (e.g. --results verified --branch main)"
    required: false
    default: ""

  # ------------------------------------------------------------------
  # IaC (Checkov) - with framework support
  # ------------------------------------------------------------------
  iac_command:
    description: "iac: raw command text passed to --command. When set, overrides iac_directory/iac_file/iac_framework/iac_compact/iac_quiet."
    required: false
    default: ""
  iac_directory:
    description: "iac: directory with infrastructure code to scan"
    required: false
    default: "."
  iac_file:
    description: "iac: specific file to scan; cannot be used with iac_directory"
    required: false
    default: ""
  iac_framework:
    description: "iac: restrict scan to specific framework(s), e.g. Kubernetes, Terraform, terraform_plan (comma-separated for multiple)"
    required: false
    default: ""
  iac_compact:
    description: "iac: do not display code blocks in output"
    required: false
    default: "true"
  iac_quiet:
    description: "iac: display only failed checks"
    required: false
    default: "true"

  # ------------------------------------------------------------------
  # ML Static Scan (ModelScan)
  # ------------------------------------------------------------------
  ml_command:
    description: "ml: command text passed to --command (e.g. 'scan -p . -r json')"
    required: false
    default: "scan -p . -r json"
  ml_model_name:
    description: "ml: custom collector/model identifier (optional)"
    required: false
    default: ""
  ml_source_type:
    description: "ml: source type for metadata"
    required: false
    default: "github"

  # ------------------------------------------------------------------
  # API Discovery (code2api)
  # ------------------------------------------------------------------
  api_command:
    description: "api-discovery: command text passed to --command (e.g. '-path . -output results.json')"
    required: false
    default: "-path . -output results.json"

  # ------------------------------------------------------------------
  # SBOM (image and filesystem)
  # ------------------------------------------------------------------
  sbom_scan_type:
    description: "sbom: target type, 'image' or 'filesystem'"
    required: false
    default: "filesystem"
  sbom_image_ref:
    description: "sbom: full registry image reference to scan (required when sbom_scan_type is image)"
    required: false
    default: ""
  sbom_scan_path:
    description: "sbom: filesystem path to scan (used when sbom_scan_type is filesystem)"
    required: false
    default: "."
  sbom_command:
    description: "sbom: raw command text passed to --command. When set, overrides sbom_scan_type/sbom_image_ref/sbom_scan_path."
    required: false
    default: ""
  sbom_severity:
    description: "sbom: comma-separated severities (UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL)"
    required: false
    default: ""
  sbom_project_name:
    description: "sbom: project name (AccuKnox entity). Required for sbom"
    required: false
    default: ""

  # ------------------------------------------------------------------
  # PR Decorator (optional) - posts findings as a GitHub PR review
  # ------------------------------------------------------------------
  pr_decorator:
    description: "Post findings as a GitHub PR review (summary comment + inline comments) after the scan(s) above. Requires the calling workflow to grant 'permissions: pull-requests: write'. No-op on anything that isn't a pull_request build."
    required: false
    default: "false"
  pr_decorator_mode:
    description: "pr_decorator: 'advisory' (comment only) or 'blocking' (REQUEST_CHANGES when a CRITICAL/HIGH finding is present)"
    required: false
    default: "advisory"
  llm_api_key:
    description: "pr_decorator: optional. If set, calls an LLM to generate a remediation suggestion for SAST findings with no native fix. Unset (default) = that step is skipped entirely - no LLM call, no cost, findings post as-is. Set together with llm_base_url and llm_model - see those two before setting this."
    required: false
    default: ""
  llm_model:
    description: "pr_decorator: required if llm_api_key is set to anything other than an OpenRouter key. The model name in whatever form llm_base_url's provider expects (e.g. 'gpt-4o-mini' for OpenAI directly, 'claude-sonnet-4-5' for an Anthropic-compatible gateway, 'openai/gpt-4o-mini' for OpenRouter, a local model name for self-hosted). No default - OpenRouter's own default (openai/gpt-4o-mini) only applies when llm_base_url is also left unset."
    required: false
    default: ""
  llm_base_url:
    description: "pr_decorator: required if llm_api_key is not an OpenRouter key. Any OpenAI-compatible chat-completions endpoint - OpenAI, Azure OpenAI, a self-hosted vLLM/Ollama/LM Studio server, Groq, Together, etc. Leaving this unset sends llm_api_key to OpenRouter's endpoint - only correct for an OpenRouter key. A native (non-OpenRouter) key sent there fails auth silently, so set this explicitly for any other provider."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # ------------------------------------------------------------------
    # Parse scan_type + install scanner (once)
    # ------------------------------------------------------------------
    - name: Setup AccuKnox Scanner
      id: setup
      shell: bash
      env:
        SCAN_TYPE: ${{ inputs.scan_type }}
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        SCANNER_VERSION: ${{ inputs.scanner_version }}
        SOFT_FAIL: ${{ inputs.soft_fail }}
        CONTAINER_MODE: ${{ inputs.container_mode }}
      run: |
        set -e
        if [ -z "$ACCUKNOX_ENDPOINT" ] || [ -z "$ACCUKNOX_TOKEN" ] || [ -z "$ACCUKNOX_LABEL" ]; then
          echo "ERROR: accuknox_endpoint, accuknox_token, and accuknox_label must be set!"
          exit 1
        fi

        # Parse scan_type into exact tokens (lowercase, comma/space separated)
        run_sast=false; run_sca=false; run_secret=false; run_iac=false
        run_ml=false; run_api=false; run_sbom=false
        NORM=$(echo "$SCAN_TYPE" | tr 'A-Z' 'a-z' | tr ',' ' ')
        for t in $NORM; do
          case "$t" in
            sast)                       run_sast=true ;;
            sca)                        run_sca=true ;;
            secret|secrets)             run_secret=true ;;
            iac)                        run_iac=true ;;
            ml|ml-scan|mlscan)          run_ml=true ;;
            api|api-discovery)          run_api=true ;;
            sbom)                       run_sbom=true ;;
            "")                         ;;
            *) echo "WARNING: unknown scan type '$t' (valid: sast, sca, secret, iac, ml, api-discovery, sbom)" ;;
          esac
        done

        case "$run_sast$run_sca$run_secret$run_iac$run_ml$run_api$run_sbom" in
          *true*) ;;
          *) echo "ERROR: scan_type did not match any known scan. Provide one or more of: sast, sca, secret, iac, ml, api-discovery, sbom."; exit 1 ;;
        esac

        # Normalise soft_fail/container_mode once; every scan step reuses these.
        SOFT_FAIL="${SOFT_FAIL//[$'\t\r\n ']}"
        CONTAINER_MODE="${CONTAINER_MODE//[$'\t\r\n ']}"
        {
          echo "SOFT_FAIL=$SOFT_FAIL"
          [ "$SOFT_FAIL" = "true" ] && echo "SOFT_FAIL_ARG=--softfail" || echo "SOFT_FAIL_ARG="
          [ "$CONTAINER_MODE" = "true" ] && echo "CONTAINER_MODE_ARG=--container-mode" || echo "CONTAINER_MODE_ARG="
        } >> "$GITHUB_ENV"

        # Whether each scan's container image is needed - true only when
        # container_mode is on AND that scan is selected. Computed once here
        # so the cache/pull steps below don't each re-derive the same logic.
        img_sast=false; img_container=false; img_secret=false; img_iac=false
        if [ "$CONTAINER_MODE" = "true" ]; then
          $run_sast && img_sast=true
          { $run_sca || $run_sbom; } && img_container=true
          $run_secret && img_secret=true
          $run_iac && img_iac=true
        fi

        {
          echo "run_sast=$run_sast"
          echo "run_sca=$run_sca"
          echo "run_secret=$run_secret"
          echo "run_iac=$run_iac"
          echo "run_ml=$run_ml"
          echo "run_api=$run_api"
          echo "run_sbom=$run_sbom"
          echo "container_mode=$CONTAINER_MODE"
          echo "img_sast=$img_sast"
          echo "img_container=$img_container"
          echo "img_secret=$img_secret"
          echo "img_iac=$img_iac"
        } >> "$GITHUB_OUTPUT"

        echo "Downloading AccuKnox ASPM Scanner ($SCANNER_VERSION)..."
        SCANNER_BIN="$RUNNER_TEMP/accuknox-aspm-scanner"
        curl -L "https://github.com/accuknox/aspm-scanner-cli/releases/download/${SCANNER_VERSION}/accuknox-aspm-scanner" -o "$SCANNER_BIN"
        chmod +x "$SCANNER_BIN"
        echo "ACCUKNOX_SCANNER=$SCANNER_BIN" >> "$GITHUB_ENV"
        echo "AccuKnox ASPM scanner installed at $SCANNER_BIN"

        # Only the tools the selected scans need, and only in local mode -
        # container_mode=true runs everything in Docker, so there's nothing
        # local to install/cache. The key changes with the scanner binary or tool set.
        tools=""
        if [ "$CONTAINER_MODE" != "true" ]; then
          $run_sast && tools+=" sast"
          { $run_sca || $run_sbom; } && tools+=" container"
          $run_secret && tools+=" secret"
          $run_iac && tools+=" iac"
        fi
        echo "tools=$tools" >> "$GITHUB_OUTPUT"
        sha=$(sha256sum "$SCANNER_BIN" | cut -c1-12)
        echo "scanner_sha=$sha" >> "$GITHUB_OUTPUT"
        echo "tools_key=$sha${tools// /-}" >> "$GITHUB_OUTPUT"

    - name: Cache scanner tools
      id: tools-cache
      if: steps.setup.outputs.tools != ''
      uses: actions/cache@v4
      with:
        path: ~/.local/bin/accuknox
        key: accuknox-tools-${{ runner.os }}-${{ steps.setup.outputs.tools_key }}
        restore-keys: accuknox-tools-${{ runner.os }}-${{ steps.setup.outputs.scanner_sha }}

    - name: Install scanner tools
      if: steps.setup.outputs.tools != '' && steps.tools-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -e
        # `tool install` exits 0 even when the download silently fails, so
        # verify the expected binary actually landed and retry instead of
        # trusting the exit code.
        if [ -d /usr/share/accuknox-aspm-scanner/tools ]; then
          TOOLS_DIR=/usr/share/accuknox-aspm-scanner/tools
        else
          TOOLS_DIR="$HOME/.local/bin/accuknox"
        fi

        install_tool() {
          verify_path="$TOOLS_DIR/$2"
          [ -e "$verify_path" ] && return 0
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "Installing scanner tool '$1' (attempt $attempt/3)..."
            "$ACCUKNOX_SCANNER" tool install --type "$1" || true
            [ -e "$verify_path" ] && return 0
            echo "WARNING: '$1' not present at $verify_path after install; retrying..."
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "ERROR: failed to install scanner tool '$1' (expected $verify_path)."
          return 1
        }

        for t in ${{ steps.setup.outputs.tools }}; do
          verify_rel="$t"; [ "$t" = sast ] && verify_rel="sast/sast"
          install_tool "$t" "$verify_rel"
        done

    # ML/API Discovery have no local tool-install path in this CLI, so they
    # always run --container-mode. sast/sca/secret/iac/sbom only go through
    # Docker when container_mode=true is explicitly requested. Either way,
    # cache the image as a docker-save tarball instead of re-pulling it.
    - name: Restore cached ML scan image
      id: ml-image-cache
      if: steps.setup.outputs.run_ml == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/accuknox-images/ml-scan.tar
        key: accuknox-image-ml-scan-1.0.21-linux-amd64

    - name: Restore cached API Discovery image
      id: api-image-cache
      if: steps.setup.outputs.run_api == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/accuknox-images/api-discovery.tar
        key: accuknox-image-api-discovery-0.1.0-linux-amd64

    - name: Restore cached SAST image
      id: sast-image-cache
      if: steps.setup.outputs.img_sast == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/accuknox-images/sast.tar
        key: accuknox-image-sast-0.1.0-linux-amd64

    - name: Restore cached container (SCA/SBOM) image
      id: container-image-cache
      if: steps.setup.outputs.img_container == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/accuknox-images/container.tar
        key: accuknox-image-container-0.69.3-linux-amd64

    - name: Restore cached Secret image
      id: secret-image-cache
      if: steps.setup.outputs.img_secret == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/accuknox-images/secret.tar
        key: accuknox-image-secret-3.90.3-linux-amd64

    - name: Restore cached IaC image
      id: iac-image-cache
      if: steps.setup.outputs.img_iac == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/accuknox-images/iac.tar
        key: accuknox-image-iac-3.2.458-linux-amd64

    - name: Load or pull container-mode images
      if: steps.setup.outputs.run_ml == 'true' || steps.setup.outputs.run_api == 'true' || steps.setup.outputs.img_sast == 'true' || steps.setup.outputs.img_container == 'true' || steps.setup.outputs.img_secret == 'true' || steps.setup.outputs.img_iac == 'true'
      shell: bash
      run: |
        set -e
        load_or_pull() {
          [ "$1" = true ] || return 0
          [ "$2" = true ] && { docker load -i "$4"; return; }
          docker pull ${5:+--platform "$5"} "$3" && mkdir -p "$(dirname "$4")" && docker save -o "$4" "$3"
        }
        load_or_pull "${{ steps.setup.outputs.run_ml }}" "${{ steps.ml-image-cache.outputs.cache-hit }}" public.ecr.aws/k9v9d5v2/accuknox/ondemand_modelscan:1.0.21 "${{ runner.temp }}/accuknox-images/ml-scan.tar" linux/amd64
        load_or_pull "${{ steps.setup.outputs.run_api }}" "${{ steps.api-image-cache.outputs.cache-hit }}" public.ecr.aws/k9v9d5v2/accuknox/code2api:0.1.0 "${{ runner.temp }}/accuknox-images/api-discovery.tar"
        load_or_pull "${{ steps.setup.outputs.img_sast }}" "${{ steps.sast-image-cache.outputs.cache-hit }}" public.ecr.aws/k9v9d5v2/accuknox/opengrepjob:0.1.0 "${{ runner.temp }}/accuknox-images/sast.tar"
        load_or_pull "${{ steps.setup.outputs.img_container }}" "${{ steps.container-image-cache.outputs.cache-hit }}" public.ecr.aws/k9v9d5v2/accuknox/trivy:0.69.3 "${{ runner.temp }}/accuknox-images/container.tar"
        load_or_pull "${{ steps.setup.outputs.img_secret }}" "${{ steps.secret-image-cache.outputs.cache-hit }}" public.ecr.aws/k9v9d5v2/trufflesecurity/trufflehog:3.90.3 "${{ runner.temp }}/accuknox-images/secret.tar"
        load_or_pull "${{ steps.setup.outputs.img_iac }}" "${{ steps.iac-image-cache.outputs.cache-hit }}" public.ecr.aws/k9v9d5v2/bridgecrew/checkov:3.2.458 "${{ runner.temp }}/accuknox-images/iac.tar"

    # ------------------------------------------------------------------
    # SAST (OpenGrep)
    # ------------------------------------------------------------------
    - name: Run AccuKnox SAST Scan
      if: ${{ steps.setup.outputs.run_sast == 'true' }}
      shell: bash
      env:
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        COMMAND: ${{ inputs.sast_command }}
        SEVERITY: ${{ inputs.sast_severity }}
      run: |
        set -e
        echo "Starting AccuKnox SAST (OpenGrep) scan..."

        SEVERITY="${SEVERITY//[$'\t\r\n ']}"
        SEVERITY_ARG=""
        [ -n "$SEVERITY" ] && SEVERITY_ARG="--severity $SEVERITY"

        "$ACCUKNOX_SCANNER" scan --keep-results $SOFT_FAIL_ARG sast \
          --command "$COMMAND" \
          --repo-url "https://github.com/${GITHUB_REPOSITORY}.git" \
          --commit-sha "${GITHUB_SHA}" \
          --pipeline-id "${GITHUB_RUN_ID}" \
          --job-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          $SEVERITY_ARG $CONTAINER_MODE_ARG

        # SCA also defaults to ./results.json - rename immediately so a
        # later "scan_type: sast,sca" run doesn't have SCA silently
        # overwrite this file before it's uploaded as an artifact or read
        # by the PR Decorator step below.
        [ -f results.json ] && mv results.json sast-results.json || true

    # ------------------------------------------------------------------
    # SCA (Trivy filesystem)
    # ------------------------------------------------------------------
    - name: Run AccuKnox SCA Scan
      if: ${{ steps.setup.outputs.run_sca == 'true' }}
      shell: bash
      env:
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        COMMAND: ${{ inputs.sca_command }}
        SEVERITY: ${{ inputs.sca_severity }}
      run: |
        set -e
        echo "Starting AccuKnox SCA scan..."

        SEVERITY="${SEVERITY//[$'\t\r\n ']}"
        SEVERITY_ARG=""
        [ -n "$SEVERITY" ] && SEVERITY_ARG="--severity $SEVERITY"

        # Asset identity is passed explicitly: git-derived defaults are wrong on
        # PR builds, where the checkout is a detached HEAD.
        "$ACCUKNOX_SCANNER" scan --keep-results $SOFT_FAIL_ARG sca \
          --command "$COMMAND" \
          --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
          --repo-branch "${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" \
          $SEVERITY_ARG $CONTAINER_MODE_ARG

        # See the matching rename in the SAST step - same default filename.
        [ -f results.json ] && mv results.json sca-results.json || true

    # ------------------------------------------------------------------
    # Secret (TruffleHog)
    # ------------------------------------------------------------------
    - name: Run AccuKnox Secret Scan
      if: ${{ steps.setup.outputs.run_secret == 'true' }}
      shell: bash
      env:
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        COMMAND: ${{ inputs.secret_command }}
        ADDITIONAL_ARGUMENTS: ${{ inputs.secret_additional_arguments }}
      run: |
        set -e
        echo "Starting AccuKnox Secret scan..."

        touch ./results.jsonl
        chmod 666 ./results.jsonl

        FULL_CMD="$COMMAND"
        [ -n "$ADDITIONAL_ARGUMENTS" ] && FULL_CMD="$FULL_CMD $ADDITIONAL_ARGUMENTS"

        "$ACCUKNOX_SCANNER" scan --keep-results $SOFT_FAIL_ARG secret --command "$FULL_CMD" $CONTAINER_MODE_ARG

    # ------------------------------------------------------------------
    # IaC (Checkov) - with frameworks
    # ------------------------------------------------------------------
    - name: Run AccuKnox IaC Scan
      if: ${{ steps.setup.outputs.run_iac == 'true' }}
      shell: bash
      env:
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        RAW_COMMAND: ${{ inputs.iac_command }}
        DIRECTORY: ${{ inputs.iac_directory }}
        FILE: ${{ inputs.iac_file }}
        FRAMEWORK: ${{ inputs.iac_framework }}
        COMPACT: ${{ inputs.iac_compact }}
        QUIET: ${{ inputs.iac_quiet }}
      run: |
        set -e
        echo "Starting AccuKnox IaC scan..."

        if [ -n "$RAW_COMMAND" ]; then
          CMD_ARGS="$RAW_COMMAND"
        else
          CMD_ARGS=""
          # --file and --directory are mutually exclusive in Checkov; file wins.
          if [ -n "$FILE" ]; then
            CMD_ARGS="$CMD_ARGS --file $FILE"
          elif [ -n "$DIRECTORY" ]; then
            CMD_ARGS="$CMD_ARGS --directory $DIRECTORY"
          fi
          [ "$COMPACT" = "true" ] && CMD_ARGS="$CMD_ARGS --compact"
          [ "$QUIET" = "true" ] && CMD_ARGS="$CMD_ARGS --quiet"
          # Support one or more comma-separated frameworks
          if [ -n "$FRAMEWORK" ]; then
            for fw in $(echo "$FRAMEWORK" | tr ',' ' '); do
              CMD_ARGS="$CMD_ARGS --framework $fw"
            done
          fi
        fi

        # --keep-results: without it the file is deleted right after
        # upload, before the PR Decorator step below can read it.
        "$ACCUKNOX_SCANNER" scan --keep-results $SOFT_FAIL_ARG iac --command "$CMD_ARGS" --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" --repo-branch "${GITHUB_REF#refs/heads/}" $CONTAINER_MODE_ARG

    # ------------------------------------------------------------------
    # ML Static Scan (ModelScan)
    # ------------------------------------------------------------------
    - name: Run AccuKnox ML Static Scan
      if: ${{ steps.setup.outputs.run_ml == 'true' }}
      shell: bash
      env:
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        COMMAND: ${{ inputs.ml_command }}
        MODEL_NAME: ${{ inputs.ml_model_name }}
        SOURCE_TYPE: ${{ inputs.ml_source_type }}
      run: |
        set -e
        echo "Starting AccuKnox ML Static scan..."

        EXTRA=""
        [ -n "$MODEL_NAME" ] && EXTRA="$EXTRA --model-name $MODEL_NAME"
        [ -n "$SOURCE_TYPE" ] && EXTRA="$EXTRA --source-type $SOURCE_TYPE"

        "$ACCUKNOX_SCANNER" scan $SOFT_FAIL_ARG ml-scan \
          --command "$COMMAND" \
          --container-mode \
          --repo-url "${GITHUB_REPOSITORY}" \
          --commit-ref "${GITHUB_REF#refs/heads/}" \
          $EXTRA

    # ------------------------------------------------------------------
    # API Discovery (code2api)
    # ------------------------------------------------------------------
    - name: Run AccuKnox API Discovery Scan
      if: ${{ steps.setup.outputs.run_api == 'true' }}
      shell: bash
      env:
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        COMMAND: ${{ inputs.api_command }}
      run: |
        set -e
        echo "Starting AccuKnox API Discovery scan..."

        "$ACCUKNOX_SCANNER" scan --keep-results $SOFT_FAIL_ARG api-discovery \
          --command "$COMMAND" \
          --container-mode \
          --repo-url "${GITHUB_REPOSITORY}"

    # ------------------------------------------------------------------
    # SBOM (image and filesystem)
    # ------------------------------------------------------------------
    - name: Run AccuKnox SBOM Scan
      if: ${{ steps.setup.outputs.run_sbom == 'true' }}
      shell: bash
      env:
        ACCUKNOX_ENDPOINT: ${{ inputs.accuknox_endpoint }}
        ACCUKNOX_TOKEN: ${{ inputs.accuknox_token }}
        ACCUKNOX_LABEL: ${{ inputs.accuknox_label }}
        SBOM_SCAN_TYPE: ${{ inputs.sbom_scan_type }}
        IMAGE_REF: ${{ inputs.sbom_image_ref }}
        SCAN_PATH: ${{ inputs.sbom_scan_path }}
        RAW_COMMAND: ${{ inputs.sbom_command }}
        SEVERITY: ${{ inputs.sbom_severity }}
        PROJECT_NAME: ${{ inputs.sbom_project_name }}
      run: |
        set -e
        echo "Starting AccuKnox SBOM scan..."

        # Trim leading/trailing whitespace and CR/LF (preserve internal spaces
        # so names like "My Project" survive) before passing to the scanner.
        PROJECT_NAME="${PROJECT_NAME#"${PROJECT_NAME%%[![:space:]]*}"}"
        PROJECT_NAME="${PROJECT_NAME%"${PROJECT_NAME##*[![:space:]]}"}"

        if [ -z "$PROJECT_NAME" ]; then
          echo "ERROR: sbom_project_name is required for sbom."
          exit 1
        fi

        SEVERITY="${SEVERITY//[$'\t\r\n ']}"

        # The scanner runs the SBOM generator (Trivy) inside a container as root,
        # so the results.json it writes is root-owned. The scanner then enriches
        # that file in-place (injecting project_name and rewriting the in-container
        # scan root "/workdir"/image ref to the real project) BEFORE uploading.
        # As the non-root runner user that in-place write fails with a permission
        # error, which the scanner swallows and uploads the RAW file — so the
        # backend sees metadata.component.name ("/workdir" or the image ref) as the
        # project name and rejects it. Pre-create the file world-writable (same
        # trick the secret scan uses) so the enrichment write succeeds.
        touch ./results.json
        chmod 666 ./results.json

        if [ -n "$RAW_COMMAND" ]; then
          CMD="$RAW_COMMAND"
        else
          SBOM_SCAN_TYPE="${SBOM_SCAN_TYPE//[$'\t\r\n ']}"
          if [ "$SBOM_SCAN_TYPE" = "image" ]; then
            if [ -z "$IMAGE_REF" ]; then
              echo "ERROR: sbom_image_ref is required when sbom_scan_type is image."
              exit 1
            fi
            CMD="image ${IMAGE_REF}"
          elif [ "$SBOM_SCAN_TYPE" = "filesystem" ] || [ "$SBOM_SCAN_TYPE" = "path" ] || [ "$SBOM_SCAN_TYPE" = "fs" ]; then
            CMD="filesystem ${SCAN_PATH}"
          else
            echo "ERROR: Invalid sbom_scan_type: $SBOM_SCAN_TYPE. Expected image or filesystem."
            exit 1
          fi
          [ -n "$SEVERITY" ] && CMD="$CMD --severity $SEVERITY"
        fi

        "$ACCUKNOX_SCANNER" scan $SOFT_FAIL_ARG --keep-results --project-name "$PROJECT_NAME" container --command "$CMD" --generate-sbom $CONTAINER_MODE_ARG

        [ -f results.json ] && cp results.json results-sbom.json || true

    # ------------------------------------------------------------------
    # Upload kept result files (optional)
    # ------------------------------------------------------------------
    - name: Upload AccuKnox scan results
      if: ${{ inputs.upload_artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: accuknox-scan-results
        path: |
          *results*.json
          *results*.jsonl
        if-no-files-found: warn
        retention-days: 30

    # ------------------------------------------------------------------
    # PR Decorator (optional) - posts findings as a GitHub PR review
    # ------------------------------------------------------------------
    - name: Decorate Pull Request
      if: ${{ inputs.pr_decorator == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        MODE: ${{ inputs.pr_decorator_mode }}
        LLM_API_KEY: ${{ inputs.llm_api_key }}
        LLM_MODEL: ${{ inputs.llm_model }}
        LLM_BASE_URL: ${{ inputs.llm_base_url }}
      run: |
        set -e
        echo "Decorating pull request with scan findings..."

        # Only the scan types decorate-pr supports, from whichever kept
        # result files this run actually produced - not every scan_type
        # runs every job, and ml/api-discovery/sbom aren't wired up yet
        # (see aspm-scanner-cli/docs/pr-decorator.md).
        RESULT_FILES=""
        SCAN_TYPES=""
        add_result() {
          [ -f "$1" ] || return 0
          RESULT_FILES="${RESULT_FILES:+$RESULT_FILES,}$1"
          SCAN_TYPES="${SCAN_TYPES:+$SCAN_TYPES,}$2"
        }
        add_result sast-results.json sast
        add_result sca-results.json sca
        add_result results_json.json iac
        add_result results.jsonl secret

        if [ -z "$RESULT_FILES" ]; then
          echo "No decorate-pr-supported scan result files found (sast/sca/iac/secret) - skipping."
          exit 0
        fi

        # Quality gate stays at decorate-pr's own defaults (0 CRITICAL, 0
        # HIGH, unlimited MEDIUM/LOW) - not customer-configurable here. If a
        # different gate is ever needed, add --max-* flags back explicitly.
        LLM_ARGS=""
        if [ -n "$LLM_API_KEY" ]; then
          LLM_ARGS="--llm-api-key $LLM_API_KEY"
          if [ -n "$LLM_BASE_URL" ]; then
            LLM_ARGS="$LLM_ARGS --llm-base-url $LLM_BASE_URL"
            [ -n "$LLM_MODEL" ] && LLM_ARGS="$LLM_ARGS --llm-model $LLM_MODEL"
          else
            # No llm_base_url -> decorate-pr sends this key to OpenRouter's
            # endpoint. Only correct for an actual OpenRouter key - a native
            # OpenAI/Azure/self-hosted key sent there fails auth silently
            # (a log warning, remediation just doesn't get generated), so
            # this is loud on purpose.
            echo "::warning::llm_api_key is set without llm_base_url - assuming this is an OpenRouter key. If it's an OpenAI/Azure/self-hosted/other key, set llm_base_url (and usually llm_model) too, or remediation calls will silently fail auth."
          fi
        fi

        "$ACCUKNOX_SCANNER" decorate-pr \
          --result-file "$RESULT_FILES" \
          --scan-type "$SCAN_TYPES" \
          --mode "$MODE" \
          $LLM_ARGS
